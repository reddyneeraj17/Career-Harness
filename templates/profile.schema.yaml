# =============================================================================
# profile.schema.yaml — validation schema for profile.yaml
# =============================================================================
# Used by the compile-schedules skill BEFORE rendering any cron body or calling
# profile_put. Any missing required key, wrong type, or out-of-enum value FAILS
# the compile loudly. A half-profile never ships.
#
# Conventions used below:
#   required: true|false   — key must be present
#   type:                  — string | integer | boolean | list | map | null-ok
#   enum:                  — allowed values (exact match)
#   min:                   — minimum for integers
#   items:                 — item constraint for lists
# =============================================================================

identity:
  required: true
  type: map
  fields:
    name:         {required: true, type: string}
    email:         {required: true, type: string}
    phone:         {required: true, type: string}
    city:         {required: true, type: string}
    state:        {required: true, type: string}
    linkedin_url: {required: true, type: string}

work_auth:
  required: true
  type: map
  fields:
    status:           {required: true, type: string, enum: [H-1B, H1B, US citizen, Green card, OPT, STEM OPT, TN, EAD]}
    sponsor_required:  {required: true, type: boolean}
    h1b_gate:         {required: true, type: string, enum: [hard, soft]}

role_types:
  required: true
  type: list
  items: {type: string, enum: [full_time, part_time, w2_contract, c2c_contract, internship]}
  min_items: 1

locations:
  required: true
  type: map
  fields:
    us_only: {required: true, type: boolean}
    remote:  {required: true, type: string, enum: [ok, only, no]}
    metros:  {required: false, type: list, items: {type: string}}

targeting:
  required: true
  type: map
  fields:
    tiers:      {required: true, type: list, items: {type: integer, enum: [1, 2, 3]}}
    industries: {required: true, type: list, items: {type: string}, min_items: 1}
    seniority:  {required: true, type: list, items: {type: string, enum: [junior, mid, senior, staff, architect, principal, lead, director]}, min_items: 1}
    # Target job titles. Free-form strings (titles vary too much for an enum),
    # e.g. "Senior Data Engineer", "Staff Data Scientist", "ML Engineer".
    # Scouts build search queries from titles x seniority x industries.
    titles:     {required: true, type: list, items: {type: string}, min_items: 1}

comp:
  required: true
  type: map
  fields:
    floor:             {required: true, type: null-ok}
    negotiable_answer: {required: true, type: string}
    zero_ok:          {required: true, type: boolean}

start_date:
  required: true
  type: string
  format: YYYY-MM-DD

answers:
  required: true
  type: map
  fields:
    relocate:             {required: true, type: string}
    restrictive_covenants: {required: true, type: string}
    drivers_license:      {required: true, type: string}
    degree_dates:         {required: true, type: string}
  allow_extra_keys: true   # standing answers grow at intake; extras are fine

caps:
  required: true
  type: map
  fields:
    per_run:                 {required: true, type: integer, min: 1}
    per_day:                 {required: true, type: integer, min: 1}
    appliers:                {required: true, type: integer, min: 1}
    linkedin_actions_per_hour: {required: true, type: integer, min: 1}

reply_tiers:
  required: true
  type: map
  fields:
    auto_send:        {required: true, type: list, items: {type: string, pattern: "^R[1-8]$"}, min_items: 1}
    draft_for_review: {required: true, type: list, items: {type: string}, min_items: 1}
    never:            {required: true, type: list, items: {type: string}, min_items: 1}

years_matrix:
  required: false
  type: list
  items:
    type: map
    fields:
      skill:      {required: true, type: string}
      category:   {required: false, type: string}
      years:      {required: true, type: integer, min: 0}
      where_used: {required: false, type: string}

resumes:
  required: true
  type: map
  fields:
    dir:           {required: true, type: string}
    filename_rule: {required: true, type: string}

campaigns:
  required: true
  type: map
  fields:
    # cadence: free-text schedule ("daily 07:00", "2h weekdays", "hourly", "every 15m", "Friday 5:00pm CT").
    #   When an entry is absent, compile-schedules falls back to the template/skill-convention default.
    # enabled: optional, defaults true. enabled: false saves the cron job DISABLED (never deleted);
    #   re-enabling is a recompile. Dashboard edits via the schedule_update action.
    morning_run:      {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    linkedin_feed:    {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    career_portal:    {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    job_board:        {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    email_scan:       {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    linkedin_replies: {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    approval_judge:   {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    daily_report:     {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    token_usage:      {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    weekly_review:    {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    harness_doctor:   {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    profile_watch:    {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    browser_watch:    {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    schedule_trigger_dispatch: {required: false, type: map, fields: {cadence: {required: true, type: string}, enabled: {required: false, type: boolean}}}
    # schedule_trigger_dispatch default cadence (template): every 2m. Picks up
    # "Trigger now" rows from the schedule_triggers table and fires them via
    # cron.run (temporary enable → run → re-disable for disabled schedules).
    # A control-plane job: always compiled, even when all campaigns are off.
    # browser_watch default cadence (template): every 2m. Forwards fresh browser
    # screenshots of watched runs (run_watch_set watch_chat=true) to the chat
    # the schedule was compiled from. Silent when nothing is watched.

tailoring:
  required: false
  type: map
  fields:
    # Customer-banned buzzwords. The reviewer rejects any tailored PDF or cover
    # letter containing one. Empty/missing = no banned terms.
    forbid_terms: {required: false, type: list, items: {type: string}}
